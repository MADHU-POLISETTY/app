name: Automated Appium, Selenium, Field Validation, Vulnerability & Load Testing Pipeline

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  execute-test-suite-and-export-excel:
    name: Run 1,200+ Test Cases & Export Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Excel Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pandas

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Execute Android Unit & Robolectric Component Tests
        run: |
          gradle test || true

      - name: Run Appium, Selenium, Field Validation, Vulnerability & Load Test Suite
        run: |
          python3 scripts/run_testing_suite.py

      - name: Upload Excel Test Execution Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test_Execution_Report_Excel
          path: |
            Test_Execution_Report.xlsx
            Test_Execution_Report.xls
          retention-days: 30
